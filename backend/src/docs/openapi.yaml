        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumInput'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Albums
      summary: Excluir álbum
      operationId: delete_albums
      description: '**Somente admin.**  A exclusão remove em cascata os registros dependentes.'
      parameters:
      - name: id
        in: path
        required: true
        description: ID do álbum
        schema:
          type: integer
      responses:
        '204':
          description: Excluído
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /music:
    get:
      tags:
      - Music
      summary: Listar música
      operationId: list_music
      description: Qualquer usuário autenticado.
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Lista de registros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Music'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Music
      summary: Criar música
      operationId: create_music
      description: '**Somente admin.** Aceita JSON ou `multipart/form-data` com o arquivo de capa no campo `cover`
        (JPG, PNG ou WEBP, até 5 MB).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MusicInputMultipart'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Music'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /music/{id}:
    get:
      tags:
      - Music
      summary: Buscar música por ID
      operationId: get_music
      parameters:
      - name: id
        in: path
        required: true
        description: ID da música
        schema:
          type: integer
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Music'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Music
      summary: Atualizar música
      operationId: update_music
      description: '**Somente admin.** Aceita JSON ou `multipart/form-data` com o arquivo de capa no campo `cover`
        (JPG, PNG ou WEBP, até 5 MB). Atualização **parcial**: envie apenas os campos a alterar.'
      parameters:
      - name: id
        in: path
        required: true
        description: ID da música
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MusicInputMultipart'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Music'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Music
      summary: Excluir música
      operationId: delete_music
      description: '**Somente admin.** Aceita JSON ou `multipart/form-data` com o arquivo de capa no campo `cover`
        (JPG, PNG ou WEBP, até 5 MB). A exclusão remove em cascata os registros dependentes.'
      parameters:
      - name: id
        in: path
        required: true
        description: ID da música
        schema:
          type: integer
      responses:
        '204':
          description: Excluído
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /music-history:
    get:
      tags:
      - Music history
      summary: Listar entrada do histórico de músicas
      operationId: list_music_history
      description: Retorna apenas os registros do usuário logado (inclusive para admin).
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Lista de registros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MusicHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Music history
      summary: Criar entrada do histórico de músicas
      operationId: create_music_history
      description: O `id_user` é sempre o do token; não precisa ser enviado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicHistoryInput'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /music-history/{id}:
    get:
      tags:
      - Music history
      summary: Buscar entrada do histórico de músicas por ID
      operationId: get_music_history
      parameters:
      - name: id
        in: path
        required: true
        description: ID da entrada (`id_history`)
        schema:
          type: integer
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Music history
      summary: Atualizar entrada do histórico de músicas
      operationId: update_music_history
      description: 'O `id_user` é sempre o do token; não precisa ser enviado. Atualização **parcial**: envie apenas
        os campos a alterar.'
      parameters:
      - name: id
        in: path
        required: true
        description: ID da entrada (`id_history`)
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicHistoryInput'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Music history
      summary: Excluir entrada do histórico de músicas
      operationId: delete_music_history
      description: Exclusão do registro.
      parameters:
      - name: id
        in: path
        required: true
        description: ID da entrada (`id_history`)
        schema:
          type: integer
      responses:
        '204':
          description: Excluído
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /search-history:
    get:
      tags:
      - Search history
      summary: Listar entrada do histórico de buscas
      operationId: list_search_history
      description: Retorna apenas os registros do usuário logado (inclusive para admin).
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Lista de registros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
