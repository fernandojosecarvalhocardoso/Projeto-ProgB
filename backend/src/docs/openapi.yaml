openapi: 3.0.3
info:
  title: API de Música
  version: 1.2.0
  description: |-
    API REST de streaming de músicas.

    **Como autenticar:** faça `POST /auth/login` (ou `/auth/register`), copie o `token` da resposta, clique em **Authorize** e cole o token. O prefixo `Bearer` é adicionado automaticamente.

    **Papéis:** `user` (padrão) e `admin`. Somente admin cria, edita e exclui artistas, álbuns e músicas.
servers:
- url: /
  description: Servidor atual
security:
- bearerAuth: []
tags:
- name: Auth
- name: Users
- name: Artists
- name: Albums
- name: Music
- name: Music history
- name: Search history
- name: Favorites
- name: Covers
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Cadastrar usuário
      operationId: register
      security: []
      description: Cadastro público. O papel (`role`) é sempre `user`. Retorna o usuário e um token JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Fazer login
      operationId: login
      security: []
      description: Retorna o usuário e um token JWT. Use o token no botão **Authorize**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Dados do usuário logado
      operationId: me
      responses:
        '200':
          description: Usuário atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      tags:
      - Users
      summary: Listar usuários
      operationId: list_users
      description: '`user` recebe apenas a si mesmo. `admin` recebe todos. O hash da senha nunca é retornado.'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{id}:
    get:
      tags:
      - Users
      summary: Buscar usuário por ID
      operationId: get_user
      description: '`user` só acessa o próprio ID (outros retornam 404). `admin` acessa qualquer um.'
      parameters:
      - name: id
        in: path
        required: true
        description: ID do usuário
        schema:
          type: integer
      responses:
        '200':
          description: Usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Users
      summary: Atualizar usuário
      operationId: update_user
      description: Atualização **parcial**. `user` só altera a si mesmo. Alterar `role` é permitido **somente a
        admin**, que não pode rebaixar a si próprio. A criação de contas é feita em `/auth/register`.
      parameters:
      - name: id
        in: path
        required: true
        description: ID do usuário
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Users
      summary: Excluir usuário
      operationId: delete_user
      description: '`user` só apaga a si mesmo; `admin` apaga qualquer um. Remove em cascata histórico, buscas e
        favoritos do usuário.'
      parameters:
      - name: id
        in: path
        required: true
        description: ID do usuário
        schema:
          type: integer
      responses:
        '204':
          description: Excluído
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /artists:
    get:
      tags:
      - Artists
      summary: Listar artista
      operationId: list_artists
      description: Qualquer usuário autenticado.
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Lista de registros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artist'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Artists
      summary: Criar artista
      operationId: create_artists
      description: '**Somente admin.** '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistInput'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /artists/{id}:
    get:
      tags:
      - Artists
      summary: Buscar artista por ID
      operationId: get_artists
      parameters:
      - name: id
        in: path
        required: true
        description: ID do artista
        schema:
          type: integer
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Artists
      summary: Atualizar artista
      operationId: update_artists
      description: '**Somente admin.**  Atualização **parcial**: envie apenas os campos a alterar.'
      parameters:
      - name: id
        in: path
        required: true
        description: ID do artista
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistInput'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Artists
      summary: Excluir artista
      operationId: delete_artists
      description: '**Somente admin.**  A exclusão remove em cascata os registros dependentes.'
      parameters:
      - name: id
        in: path
        required: true
        description: ID do artista
        schema:
          type: integer
      responses:
        '204':
          description: Excluído
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /albums:
    get:
      tags:
      - Albums
      summary: Listar álbum
      operationId: list_albums
      description: Qualquer usuário autenticado.
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Lista de registros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Album'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Albums
      summary: Criar álbum
      operationId: create_albums
      description: '**Somente admin.** '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumInput'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /albums/{id}:
    get:
      tags:
      - Albums
      summary: Buscar álbum por ID
      operationId: get_albums
      parameters:
      - name: id
        in: path
        required: true
        description: ID do álbum
        schema:
          type: integer
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
