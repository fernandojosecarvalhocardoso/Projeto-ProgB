      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /search-history/{id}:
    get:
      tags:
      - Search history
      summary: Buscar entrada do histórico de buscas por ID
      operationId: get_search_history
      parameters:
      - name: id
        in: path
        required: true
        description: ID da entrada
        schema:
          type: integer
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Search history
      summary: Atualizar entrada do histórico de buscas
      operationId: update_search_history
      description: 'O `id_user` é sempre o do token; não precisa ser enviado. Atualização **parcial**: envie apenas
        os campos a alterar.'
      parameters:
      - name: id
        in: path
        required: true
        description: ID da entrada
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchHistoryInput'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Search history
      summary: Excluir entrada do histórico de buscas
      operationId: delete_search_history
      description: Exclusão do registro.
      parameters:
      - name: id
        in: path
        required: true
        description: ID da entrada
        schema:
          type: integer
      responses:
        '204':
          description: Excluído
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /favorites:
    get:
      tags:
      - Favorites
      summary: Listar meus favoritos
      operationId: list_favorites
      responses:
        '200':
          description: Favoritos do usuário logado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Favorite'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Favorites
      summary: Favoritar uma música
      operationId: create_favorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteInput'
      responses:
        '201':
          description: Favoritada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /favorites/{id_music}:
    delete:
      tags:
      - Favorites
      summary: Remover dos favoritos
      operationId: delete_favorite
      parameters:
      - name: id_music
        in: path
        required: true
        description: ID da música
        schema:
          type: integer
      responses:
        '204':
          description: Removido
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /covers/{filename}:
    get:
      tags:
      - Covers
      summary: Baixar imagem de capa
      operationId: get_cover
      security: []
      description: Rota **pública**. Use o campo `cover_url` retornado em `/music`.
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
        example: invasor.jpg
      responses:
        '200':
          description: Imagem
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Arquivo não encontrado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Registro não encontrado
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - user
          - admin
        created_at:
          type: string
          format: date-time
    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          writeOnly: true
        role:
          type: string
          enum:
          - user
          - admin
          description: Somente admin pode enviar este campo.
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          example: Maria
        email:
          type: string
          format: email
          example: maria@email.com
        password:
          type: string
          minLength: 8
          writeOnly: true
      required:
      - name
      - email
      - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: 'JWT para o header `Authorization: Bearer <token>`'
    Artist:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        bio:
          type: string
        created_at:
          type: string
          format: date-time
    ArtistInput:
      type: object
      properties:
        name:
          type: string
        bio:
          type: string
      required:
      - name
    Album:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        id_artist:
          type: integer
        created_at:
          type: string
          format: date-time
    AlbumInput:
      type: object
      properties:
        title:
          type: string
        id_artist:
          type: integer
      required:
      - title
      - id_artist
    Music:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        duration_seconds:
          type: integer
        id_album:
          type: integer
        genre:
          type: string
        id_artist:
          type: integer
        cover:
          type: string
          example: backend/covers/invasor.jpg
        cover_url:
          type: string
          example: /covers/invasor.jpg
        created_at:
          type: string
          format: date-time
    MusicInput:
      type: object
      properties:
        name:
          type: string
        duration_seconds:
          type: integer
        id_album:
          type: integer
        genre:
          type: string
        id_artist:
          type: integer
        cover:
          type: string
          description: Caminho já existente da capa (opcional).
      required:
      - name
      - duration_seconds
      - id_album
      - id_artist
    MusicInputMultipart:
      type: object
      properties:
        name:
          type: string
        duration_seconds:
          type: integer
        id_album:
          type: integer
        genre:
          type: string
        id_artist:
          type: integer
        cover:
          type: string
          format: binary
          description: Arquivo de imagem (JPG, PNG ou WEBP, até 5 MB).
      required:
      - name
      - duration_seconds
      - id_album
      - id_artist
    MusicHistory:
      type: object
      properties:
        id_history:
          type: integer
        id_user:
          type: integer
        id_music:
          type: integer
        created_at:
          type: string
          format: date-time
    MusicHistoryInput:
      type: object
      properties:
        id_music:
          type: integer
      required:
      - id_music
    SearchHistory:
      type: object
      properties:
        id:
          type: integer
        search_query:
          type: string
        results:
          type: string
        id_user:
          type: integer
    SearchHistoryInput:
      type: object
      properties:
        search_query:
          type: string
        results:
          type: string
      required:
      - search_query
    Favorite:
      type: object
      properties:
        id_music:
          type: integer
        music_name:
          type: string
        created_at:
          type: string
          format: date-time
    FavoriteCreated:
      type: object
      properties:
        id_user:
          type: integer
        id_music:
          type: integer
        created_at:
          type: string
          format: date-time
    FavoriteInput:
      type: object
      properties:
        id_music:
          type: integer
      required:
      - id_music
  responses:
    BadRequest:
      description: Requisição inválida (campo ausente ou formato incorreto)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Campos obrigatórios: name'
    Unauthorized:
      description: Token ausente, inválido ou expirado (ou credenciais incorretas)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Token ausente
    Forbidden:
      description: Sem permissão para esta ação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Acesso negado: permissão insuficiente'
    NotFound:
      description: Registro não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Registro não encontrado
    Conflict:
      description: 'Conflito: valor duplicado ou referência inexistente'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Registro duplicado (valor já existe)
  parameters:
    limit:
      name: limit
      in: query
      description: Máximo de itens (padrão 50, máximo 200)
      schema:
        type: integer
        default: 50
        maximum: 200
    offset:
      name: offset
      in: query
      description: Quantos itens pular
      schema:
        type: integer
        default: 0
